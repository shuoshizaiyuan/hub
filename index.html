<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的站点台 · Site Hub</title>
<style>
  :root{
    --bg:#0b1220; --bg2:#0e1729; --panel:#141d2f; --panel2:#1a2438;
    --border:#263350; --border2:#33456b;
    --text:#e8eefb; --muted:#94a3bd; --dim:#6b7c9b;
    --accent:#3b82f6; --accent2:#22d3ee; --ok:#34d399; --warn:#f59e0b; --bad:#f87171;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(59,130,246,.16), transparent 60%),
      radial-gradient(760px 460px at 92% 4%, rgba(34,211,238,.11), transparent 60%);
  }
  .wrap{position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:38px 22px 60px;}

  /* ---------- header ---------- */
  header{margin-bottom:26px;}
  .brandbar{display:flex; align-items:center; gap:13px; margin-bottom:16px;}
  .logo{
    width:44px; height:44px; border-radius:12px; flex:none;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:19px; color:#04121f; letter-spacing:-.5px;
    box-shadow:0 6px 20px rgba(59,130,246,.34);
  }
  h1{font-size:26px; font-weight:750; letter-spacing:-.3px;}
  h1 span{color:var(--accent2);}
  .sub{color:var(--muted); font-size:13.5px; margin-top:2px;}

  .statbar{display:flex; flex-wrap:wrap; gap:9px; margin-top:14px;}
  .stat{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:7px 14px; font-size:12.5px; color:var(--muted);
    display:flex; align-items:center; gap:7px;
  }
  .stat b{color:var(--text); font-size:15px; font-weight:700;}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--dim); flex:none;}
  .dot.ok{background:var(--ok); box-shadow:0 0 8px rgba(52,211,153,.7);}
  .dot.bad{background:var(--bad);}
  .dot.chk{background:var(--warn); animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:20px;}
  .search{
    flex:1 1 260px; position:relative;
  }
  .search input{
    width:100%; background:var(--panel); border:1px solid var(--border);
    color:var(--text); border-radius:11px; padding:11px 14px 11px 38px;
    font-size:14px; font-family:inherit; outline:none; transition:.18s;
  }
  .search input:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(59,130,246,.16);}
  .search input::placeholder{color:var(--dim);}
  .search svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:.5;}
  .btn{
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
    border-radius:11px; padding:11px 15px; font-size:13.5px; cursor:pointer;
    font-family:inherit; transition:.18s; white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent); color:var(--text); background:var(--panel2);}
  .btn:active{transform:translateY(1px);}

  /* ---------- grid ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:15px;}
  .card{
    background:linear-gradient(160deg,var(--panel),var(--bg2));
    border:1px solid var(--border); border-radius:15px; padding:19px;
    position:relative; overflow:hidden; transition:.2s; cursor:pointer;
    display:flex; flex-direction:column; min-height:150px;
  }
  .card::before{
    content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:var(--c,var(--accent)); opacity:.85;
  }
  .card:hover{
    border-color:var(--border2); transform:translateY(-3px);
    box-shadow:0 12px 30px rgba(0,0,0,.45);
  }
  .card.hidden{display:none;}
  .chead{display:flex; align-items:flex-start; gap:12px; margin-bottom:11px;}
  .cico{
    width:38px; height:38px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:#04121f;
    background:var(--c,var(--accent));
  }
  .ctitle{flex:1; min-width:0;}
  .cname{font-size:16px; font-weight:700; letter-spacing:-.2px; line-height:1.35;}
  .ctag{font-size:11.5px; color:var(--dim); margin-top:3px;}
  .cstatus{position:absolute; right:15px; top:17px;}
  .cdesc{
    font-size:13px; color:var(--muted); flex:1; margin-bottom:13px; line-height:1.6;
  }
  .curl{
    font-size:11.5px; color:var(--dim); font-family:ui-monospace,Menlo,Consolas,monospace;
    word-break:break-all; margin-bottom:12px; opacity:.85;
  }
  .cfoot{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .go{
    display:inline-flex; align-items:center; gap:6px;
    background:var(--c,var(--accent)); color:#04121f; font-weight:700; font-size:13px;
    padding:8px 15px; border-radius:9px; text-decoration:none; transition:.18s;
  }
  .go:hover{filter:brightness(1.12);}
  .copy{
    background:transparent; border:1px solid var(--border2); color:var(--muted);
    font-size:12px; padding:7px 11px; border-radius:8px; cursor:pointer;
    font-family:inherit; transition:.18s;
  }
  .copy:hover{border-color:var(--accent2); color:var(--accent2);}

  .empty{
    grid-column:1/-1; text-align:center; padding:52px 20px; color:var(--dim);
    border:1px dashed var(--border2); border-radius:14px; font-size:14px;
  }
  footer{
    margin-top:34px; padding-top:18px; border-top:1px solid var(--border);
    color:var(--dim); font-size:12px; display:flex; flex-wrap:wrap;
    justify-content:space-between; gap:8px;
  }
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(90px);
    background:var(--panel2); border:1px solid var(--border2); color:var(--text);
    padding:11px 20px; border-radius:11px; font-size:13.5px; z-index:99;
    opacity:0; transition:.28s; box-shadow:0 10px 30px rgba(0,0,0,.5);
  }
  .toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
  @media(max-width:560px){
    .wrap{padding:24px 15px 44px;}
    h1{font-size:21px;}
    .grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandbar">
      <div class="logo">SH</div>
      <div>
        <h1>我的<span>站点台</span></h1>
        <div class="sub" id="subtitle">全部 GitHub Pages 站点统一入口 · 一点直达</div>
      </div>
    </div>
    <div class="statbar">
      <div class="stat">站点总数 <b id="cnt">–</b></div>
      <div class="stat"><span class="dot ok"></span>在线 <b id="cntOk">–</b></div>
      <div class="stat"><span class="dot bad"></span>异常 <b id="cntBad">0</b></div>
      <div class="stat">数据更新 <b id="upd">–</b></div>
    </div>
  </header>

  <div class="toolbar">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#94a3bd" stroke-width="2.4">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="q" type="text" placeholder="搜索站名、描述或标签…" autocomplete="off">
    </div>
    <button class="btn" id="chk">一键体检</button>
    <button class="btn" id="reset">重置筛选</button>
  </div>

  <div class="grid" id="grid"></div>

  <footer>
    <div>GitHub Pages 站点聚合台 · 数据文件 sites.json</div>
    <div id="ghuser">shuoshizaiyuan.github.io</div>
  </footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* 兜底数据：sites.json 拉取失败时（如本地 file:// 直接打开）仍可正常显示 */
const FALLBACK = [
  {id:"kaoyan-vocab",name:"考研单词练习",url:"https://shuoshizaiyuan.github.io/kaoyan-vocab/",desc:"考研英语单词交互练习门户，按年份分页面，自测与标记",tag:"考研 · 英语",color:"#3b82f6"},
  {id:"guowen50",name:"古诗文五十篇",url:"https://shuoshizaiyuan.github.io/guowen50/",desc:"中国古代诗文五十篇 · 全篇 · 批注 · 赏析 · 双栏对照翻译",tag:"国学 · 诗文",color:"#f59e0b"},
  {id:"foxue",name:"佛学知识台",url:"https://shuoshizaiyuan.github.io/foxue/",desc:"佛学知识台 · 瑜伽师地论，结构与条目化阅读",tag:"佛学",color:"#a855f7"},
  {id:"study-log",name:"学习记录",url:"https://shuoshizaiyuan.github.io/study-log/",desc:"日常学习记录与进度留存",tag:"记录",color:"#10b981"},
  {id:"home",name:"根域入口",url:"https://shuoshizaiyuan.github.io/",desc:"账号根域名入口，当前自动跳转至考研单词练习门户",tag:"入口",color:"#64748b"}
];

const grid = document.getElementById('grid');
const toastEl = document.getElementById('toast');
let DATA = [];

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._t);
  toastEl._t = setTimeout(()=>toastEl.classList.remove('show'), 1900);
}

function esc(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function render(list){
  grid.innerHTML = '';
  if(!list.length){
    grid.innerHTML = '<div class="empty">没有匹配的站点</div>';
    return;
  }
  list.forEach(s=>{
    const el = document.createElement('div');
    el.className = 'card';
    el.style.setProperty('--c', s.color || '#3b82f6');
    el.dataset.id = s.id;
    el.innerHTML =
      '<div class="cstatus"><span class="dot" data-dot="'+esc(s.id)+'"></span></div>' +
      '<div class="chead">' +
        '<div class="cico">'+esc((s.name||'?').trim().charAt(0))+'</div>' +
        '<div class="ctitle">' +
          '<div class="cname">'+esc(s.name)+'</div>' +
          '<div class="ctag">'+esc(s.tag||'')+'</div>' +
        '</div>' +
      '</div>' +
      '<div class="cdesc">'+esc(s.desc||'')+'</div>' +
      '<div class="curl">'+esc(s.url)+'</div>' +
      '<div class="cfoot">' +
        '<a class="go" href="'+esc(s.url)+'" target="_blank" rel="noopener">打开 →</a>' +
        '<button class="copy" data-url="'+esc(s.url)+'">复制链接</button>' +
      '</div>';
    el.addEventListener('click', e=>{
      if(e.target.closest('.copy')) return;
      window.open(s.url, '_blank', 'noopener');
    });
    grid.appendChild(el);
  });
  grid.querySelectorAll('.copy').forEach(b=>{
    b.addEventListener('click', ()=>{
      const u = b.dataset.url;
      const done = ()=>toast('已复制：' + u);
      if(navigator.clipboard && window.isSecureContext){
        navigator.clipboard.writeText(u).then(done).catch(()=>fallbackCopy(u, done));
      } else {
        fallbackCopy(u, done);
      }
    });
  });
}

function fallbackCopy(text, cb){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); cb(); }catch(e){ toast('复制失败，请手动复制'); }
  document.body.removeChild(ta);
}

function applyFilter(){
  const q = document.getElementById('q').value.trim().toLowerCase();
  if(!q){ render(DATA); return; }
  render(DATA.filter(s =>
    (s.name||'').toLowerCase().includes(q) ||
    (s.desc||'').toLowerCase().includes(q) ||
    (s.tag||'').toLowerCase().includes(q) ||
    (s.url||'').toLowerCase().includes(q)
  ));
}

async function checkOne(s){
  const dot = grid.querySelector('[data-dot="'+s.id+'"]');
  if(!dot) return null;
  dot.className = 'dot chk';
  try{
    const r = await fetch(s.url, {method:'GET', mode:'no-cors'});
    // no-cors 下为 opaque 响应，只要没抛错即视为可达
    dot.className = 'dot ok';
    return true;
  }catch(e){
    dot.className = 'dot bad';
    return false;
  }
}

document.getElementById('chk').addEventListener('click', async ()=>{
  let ok = 0, bad = 0;
  await Promise.all(DATA.map(async s => {
    const r = await checkOne(s);
    if(r === true) ok++; else if(r === false) bad++;
  }));
  document.getElementById('cntOk').textContent = ok;
  document.getElementById('cntBad').textContent = bad;
  toast('体检完成：在线 ' + ok + ' · 异常 ' + bad);
});

document.getElementById('reset').addEventListener('click', ()=>{
  document.getElementById('q').value = '';
  render(DATA);
  toast('已重置');
});
document.getElementById('q').addEventListener('input', applyFilter);

/* 优先用远端 sites.json；失败则用内嵌兜底 */
fetch('./sites.json?t=' + Date.now(), {cache:'no-store'})
  .then(r => r.ok ? r.json() : Promise.reject('bad status'))
  .then(j => {
    DATA = (j && j.sites) ? j.sites : FALLBACK;
    if(j && j.hub && j.hub.subtitle) document.getElementById('subtitle').textContent = j.hub.subtitle;
    if(j && j.updated) document.getElementById('upd').textContent = j.updated;
  })
  .catch(()=>{ DATA = FALLBACK; document.getElementById('upd').textContent = '本地兜底'; })
  .finally(()=>{
    document.getElementById('cnt').textContent = DATA.length;
    document.getElementById('cntOk').textContent = DATA.length;
    document.getElementById('cntBad').textContent = '0';
    render(DATA);
  });
</script>
</body>
</html>
